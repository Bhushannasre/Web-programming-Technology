<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="form.css">
    <script
src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js">
</script>
    <title>Form creation using Bootstrap</title>
</head>
<body>
    <div class="container mt-3">
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark; ">
            <h1 >Employee Information</h1>
        </nav>
        
    </div>
    <div class="container">
        <form action="">
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input  type="text" ng-model="selected" uib-typeahead="state for state in states | filter:viewValue | limitTo:5" class="form-control">
                <label for="Designation" class="form-label">Designation:</label>
                <input  type="text" ng-model="selected" uib-typeahead="state for state in states | filter:viewValue | limitTo:5" class="form-control">
                <label for="Number" class="form-label">Phone No:</label>
                <input  type="number" ng-model="selected" uib-typeahead="state for state in states | filter:viewValue | limitTo:5" class="form-control">
               <div class="dropdown">
                <button type="button" class="btn btn-danger" data-bs-toggle="dropdown">City</button>
                <ul class="dropdown-menu">
                    <li>Nagpur</li>
                    <li>Pune</li>
                    <li>Banglore</li>
                    <li>Hydrabad</li>
                    <li>Chennai</li>
                </ul>
               </div>
            </div>
            <button type="submit" class="btn btn-primary" id="btn">Submit</button>
        </form>

    </div>
    <div>
        <table class="table table-striped">
            <thead>
                <tr>
                    <td>Name</td>
                    <td>Designation</td>
                    <td>Phone Number</td>
                    <td>City</td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Bhushan Nasre</td>
                    <td>React Developer</td>
                    <td>1234567890</td>
                    <td>Nagpur</td>
                </tr>
                <tr>
                    <td>Komal Nasre</td>
                    <td>Human Resorce</td>
                    <td>1234567897</td>
                    <td>Pune</td>
                </tr>
                <tr>
                    <td>Pallavi Bhadake</td>
                    <td>Graphic Designer</td>
                    <td>1234567898</td>
                    <td>Nagpur</td>
                </tr>
            </tbody>

        </table>
    </div>
    
    <h3>Bar chart</h3>
        <div class="progress">
            
            <div class="progress-bar progress-bar-striped bg-warning" role="progressbar" style="width: 75%" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
          <div class="chart">
            <canvas id="myChart" style="width:100%;max-width:700px"></canvas>
          </div>
    <script src="form.js"></script>
</body>
</html>
